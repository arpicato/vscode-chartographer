<!DOCTYPE html>
<html>
    <head>
        <title>Chartographer</title>
        <style>
            #graph-container {
                position: relative;
                height: 100vh;
            }

            #cy {
                height: 100%;
                width: 100%;
                display: block;
                z-index: 10;
            }

            #node-labels {
                position: absolute;
                inset: 0;
                pointer-events: none;
                z-index: 11;
                overflow: hidden;
            }

            .node-label {
                position: absolute;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                line-height: 1.15;
                text-align: center;
                white-space: nowrap;
            }

            .node-label-title {
                font-size: 12px;
            }

            .node-label-file {
                margin-top: 2px;
                font-size: 9px;
                opacity: 0.72;
            }

            #instructions {
                position: absolute;
                top: 60px;
                left: 10px;
                background-color: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.5);
                padding: 10px;
                border-radius: 5px;
                font-size: 10px;
                line-height: 1;
                z-index: 20;
            }

            #hide-text {
                text-align: center;
                color: rgba(255, 255, 255, 0.5); /* Darkened text color */
                font-size: 8px;
                text-decoration: underline; /* Underline the text */
                margin-top: 5px; /* Add some top margin for spacing */
            }

            #question-mark {
                position: absolute;
                top: 10px;
                left: 10px;
                cursor: pointer;
                z-index: 20;

                font-size: 20px;
                color: rgba(255, 255, 255, 0.5);

                width: 40px;
                height: 40px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #question-mark:hover {
                text-decoration: underline;
            }
            #reset-zoom {
                position: absolute;
                top: 10px;
                left: 65px;
                cursor: pointer;
                z-index: 20;

                font-size: 12px;
                color: rgba(255, 255, 255, 0.5);

                width: 100px;
                height: 40px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            #klay-direction-container {
                position: absolute;
                top: 10px;
                left: 175px;
                z-index: 20;
                height: 40px;
                padding: 0 10px;
                border-radius: 10px;
                background-color: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.7);
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
            }

            #klay-direction-select {
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 5px;
                padding: 4px 6px;
                background-color: var(--vscode-dropdown-background);
                color: var(--vscode-dropdown-foreground);
                font-size: 12px;
            }

            #klay-direction-select:focus {
                border-color: var(--vscode-focusBorder);
                outline: none;
            }

            #klay-direction-select option {
                background-color: var(--vscode-dropdown-background);
                color: var(--vscode-dropdown-foreground);
            }

            #search-container {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 20;
                display: flex;
                align-items: center;
            }

            #search-input {
                padding: 8px;
                border-radius: 5px;
                border: none;
                background-color: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.9);
                width: 200px;
                font-size: 12px;
            }

            #search-results {
                position: absolute;
                top: 40px;
                right: 0;
                background-color: rgba(0, 0, 0, 0.7);
                border-radius: 5px;
                max-height: 200px;
                overflow-y: auto;
                width: 200px;
                display: none;
            }

            .search-result-item {
                padding: 8px;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.9);
                font-size: 12px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .search-result-item:hover {
                background-color: rgba(255, 255, 255, 0.1);
            }
        </style>
    </head>
    <body>
        <script>
            // Function to toggle the visibility of instructions
            function toggleInstructions() {
                var instructions = document.getElementById("instructions");
                if (instructions.style.display === "none" || instructions.style.display === "") {
                    instructions.style.display = "block";
                } else {
                    instructions.style.display = "none";
                }
            }
        </script>

        <!-- Question Mark Button -->
        <div id="question-mark" onclick="toggleInstructions()">&#63;</div>

        <!-- Instructions (Initially hidden) -->
        <div id="instructions" style="display: none;" onclick="toggleInstructions()">
            <p>Ctrl/Cmd + Left Click to go to function</p>
            <p>Left Click to highlight connections</p>
            <p>Left Click and drag to pan</p>
            <p>Scroll to zoom</p>
            <p>Alt/Opt + Left Click to expand graph by one level</p>
            <p>Alt/Opt + Shift + Left Click to expand graph recursively</p>
            <div id="hide-text">Click to hide</div>
        </div>

        <div id="reset-zoom" onclick="cy.fit()">Reset Zoom</div>

        <!-- This control changes only the currently rendered graph. -->
        <div id="klay-direction-container">
            <label for="klay-direction-select">Direction</label>
            <select id="klay-direction-select">
                <option value="DOWN">Top to bottom</option>
                <option value="RIGHT">Left to right</option>
                <option value="LEFT">Right to left</option>
                <option value="UP">Bottom to top</option>
            </select>
        </div>

        <!-- Search Bar -->
        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search nodes..." />
            <div id="search-results"></div>
        </div>

        <div id="graph-container">
            <div id="cy"></div>
            <div id="node-labels"></div>
        </div>

        <script src="{{libsURI}}/cytoscape@3.31.1/dist/cytoscape.min.js"></script>

        <script src="{{libsURI}}/klayjs@0.4.1/klay.js"></script>
        <script src="{{libsURI}}/cytoscape-klay@3.1.3/cytoscape-klay.min.js"></script>

        <script src="{{libsURI}}/elkjs@0.8.1/lib/elk.bundled.js"></script>
        <script src="{{libsURI}}/cytoscape-elk@2.2.0/dist/cytoscape-elk.min.js"></script>

        <script src="{{libsURI}}/dagre@0.8.2/dist/dagre.js"></script>
        <script src="{{libsURI}}/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>

        <script>
            // Debounce function
            function debounce(func, delay) {
                let timer;
                return function() {
                    clearTimeout(timer);
                    timer = setTimeout(func, delay);
                }
            }

            const vscode = acquireVsCodeApi();
            const isMac = navigator.platform.toUpperCase().indexOf('MAC')>=0;
            let cy = null
            const previousState = vscode.getState();
            let state = previousState || {
                config: {},
				elems: [],
			}

            const nodeLabelElements = new Map();

            const layoutDebounce = {
                klay: 5,
                elk: 500,
                dagre: 5,
            }

            const showFunctionFileSubtitles = () => {
                return state.config.showFunctionFileSubtitle === true
                    && !state.config.showFileGroupLabel;
            }

            const getLayoutOpts = () => {
                return {
                    // name: 'klay',
                    // name: 'elk',
                    // name: 'dagre',
                    name: state.config.defaultGraphLayoutAlgorithm,
                    animate: true,
                    animationDuration: 250,
                    klay: {
                        addUnnecessaryBendpoints: false,
                        direction: state.graphSettings?.klayDirection ?? state.config.defaultKlayDirection ?? 'DOWN',
                        layoutHierarchy: true,
                        spacing: state.config.klaySpacing ?? 1,
                        compactComponents: true,
                        thoroughness: 10,
                        edgeSpacingFactor: 0.5,
                        inLayerSpacingFactor: 2,
                        borderSpacing: 10,
                    },
                    elk: {
                        algorithm: 'layered',
                        //'elk.direction': 'RIGHT',
                    },
                    // dagre
                    rankDir: 'LR',
                    rankSep: 15,
                    nodeSep: 15,
                    edgeSep: 15,
                    // ranker: 'tight-tree',
                    ranker: 'network-simplex',
                }
            }

            // Define color schemes
            const colorSchemes = {
                "default": {
                    node: {
                        backgroundColor: '--vscode-menu-background',
                        color: '--vscode-menu-foreground',
                        borderColor: '--vscode-editor-foreground'
                    },
                    highlightedLeafNode: {
                        backgroundColor: '--vscode-editorWarning-background',
                        color: '--vscode-editorWarning-foreground'
                    },
                    highlightedRootNode: {
                        backgroundColor: '--vscode-editorError-background',
                        color: '--vscode-editorError-foreground'
                    },
                    compound: {
                        backgroundColor: '--vscode-editor-background'
                    },
                    edge: {
                        lineColor: '--vscode-editor-foreground',
                        arrowColor: '--vscode-editor-foreground'
                    },
                    searchHighlight: {
                        backgroundColor: '--vscode-editor-selectionBackground',
                        color: '--vscode-editor-selectionForeground',
                        borderColor: '--vscode-focusBorder'
                    }
                },
                "highContrast": {
                    node: {
                        backgroundColor: '#000000',
                        color: '#FFFFFF',
                        borderColor: '#FFFFFF'
                    },
                    highlightedLeafNode: {
                        backgroundColor: '#0000FF',
                        color: '#FFFFFF'
                    },
                    highlightedRootNode: {
                        backgroundColor: '#FF0000',
                        color: '#FFFFFF'
                    },
                    compound: {
                        backgroundColor: '#000000'
                    },
                    edge: {
                        lineColor: '#FFFFFF',
                        arrowColor: '#FFFFFF'
                    },
                    searchHighlight: {
                        backgroundColor: '#FFFF00',
                        color: '#000000',
                        borderColor: '#FFFFFF'
                    }
                }
            };

			const getCyStyle = () => {
                const style = getComputedStyle(document.body);
                const getStyle = (name) => style.getPropertyValue(name);

                // Get the selected color scheme
                const selectedScheme = state.config.colorScheme || 'default';
                const colors = colorSchemes[selectedScheme];

                // Override colors with configuration options
                const overrides = state.config.colors || {};

                // Helper function to get color value (either from CSS variable or direct color)
                const getColor = (colorValue, overrideValue) => {
                    if (overrideValue) {
                        return overrideValue;
                    }
                    return colorValue.startsWith('--') ? getStyle(colorValue) : colorValue;
                };

				return [
					{
						selector: 'node',
						style: {
							'font-size': '12px',
							'background-color': getColor(colors.node.backgroundColor, overrides.nodeBackgroundColor),
							'color': getColor(colors.node.color, overrides.nodeColor),
							'width': 'label',
							'height': 16,
							'padding': '7px',
							'border-color': getColor(colors.node.borderColor, overrides.nodeBorderColor),
							'border-width': 1,
							'shape': 'roundrectangle',
							'label': showFunctionFileSubtitles() ? 'data(displayLabel)' : 'data(label)',
							'text-opacity': 0,
							'text-wrap': 'wrap',
							'text-halign': 'center',
							'text-valign': 'center',
							'line-height': 1.2,
						}
					},
                    {
                        selector: '.hasFileSubtitle',
                        style: {
                            'height': showFunctionFileSubtitles() ? 28 : 16,
                        }
                    },
					{
						selector: '.dimmedNode',
						style: {
							'opacity': 0.5,
						}
					},
					{
						selector: '.highlightedNode',
						style: {
							'opacity': 1,
						}
					},
					{
						selector: '.highlightedLeafNode',
						style: {
							'background-color': getColor(colors.highlightedLeafNode.backgroundColor, overrides.highlightedLeafNodeBackgroundColor),
							'color': getColor(colors.highlightedLeafNode.color, overrides.highlightedLeafNodeColor),
						}
					},
					{
						selector: '.highlightedRootNode',
						style: {
							'background-color': getColor(colors.highlightedRootNode.backgroundColor, overrides.highlightedRootNodeBackgroundColor),
							'color': getColor(colors.highlightedRootNode.color, overrides.highlightedRootNodeColor),
						}
					},
					{
						selector: '.compound',
						style: {
							'font-size': '10px',
							'padding-top': state.config.showFileGroupLabel ? 25 : 10,
							'background-color': getColor(colors.compound.backgroundColor, overrides.nodeGroupBackgroundColor),
							'background-opacity': state.config.showFileGroupBox ? 1 : 0,
							'border-width': state.config.showFileGroupBox ? 1 : 0,
							'shape': 'roundrectangle',
							'label': state.config.showFileGroupLabel ? 'data(label)' : '',
							'text-opacity': 1,
							'text-valign': 'top',
							'text-halign': 'center',
							'text-margin-y': state.config.showFileGroupLabel ? 15 : 5,
						}
					},
					{
						selector: 'edge',
						style: {
							'curve-style': 'unbundled-bezier',
							'target-arrow-shape': 'triangle',
							'line-color': getColor(colors.edge.lineColor, overrides.edgeLineColor),
							'target-arrow-color': getColor(colors.edge.arrowColor, overrides.edgeArrowColor),
							'opacity': 0.5,
						}
					},
					{
						selector: '.dimmedEdge',
						style: {
							'opacity': 0.2,
						}
					},
					{
						selector: '.highlightedEdge',
						style: {
							'opacity': 1,
						}
					},
                    {
                        selector: '.searchHighlight',
                        style: {
                            'background-color': getColor(colors.searchHighlight.backgroundColor, overrides.searchHighlightBackgroundColor),
                            'color': getColor(colors.searchHighlight.color, overrides.searchHighlightColor),
                            'border-width': 2,
                            'border-color': getColor(colors.searchHighlight.borderColor, overrides.searchHighlightBorderColor),
                        }
                    },
				]
			}

			const resetRootHighlights = () => {
                if (state.config.highlightRoots) {
					cy.nodes().removeClass('highlightedRootNode');
					cy.nodes().roots().not(':parent').addClass('highlightedRootNode');
				}
			}
			const resetLeafHighlights = () => {
				if (state.config.highlightLeaves) {
					cy.nodes().removeClass('highlightedLeafNode');
					if (state.config.highlightLeaves) cy.nodes().leaves().not(':parent').addClass('highlightedLeafNode');
				}
			}
			const resetHighlights = () => {
				cy.nodes().removeClass(['dimmedNode', 'highlightedNode', 'searchHighlight']);
				cy.edges().removeClass(['dimmedEdge', 'highlightedEdge']);
				cy.nodes().data('isHighlighted', false)
			}

            // Cytoscape canvas labels use one font size, so HTML overlays provide a smaller file subtitle.
            const syncNodeLabels = () => {
                const labelsContainer = document.getElementById('node-labels');
                const activeNodeIds = new Set();
                const zoom = cy.zoom();

                cy.nodes().not(':parent').forEach(node => {
                    const nodeId = node.id();
                    activeNodeIds.add(nodeId);

                    let labelElements = nodeLabelElements.get(nodeId);
                    if (!labelElements) {
                        const container = document.createElement('div');
                        const title = document.createElement('div');
                        const file = document.createElement('div');

                        container.className = 'node-label';
                        title.className = 'node-label-title';
                        file.className = 'node-label-file';
                        container.append(title, file);
                        labelsContainer.appendChild(container);

                        labelElements = {container, title, file};
                        nodeLabelElements.set(nodeId, labelElements);
                    }

                    const position = node.renderedPosition();
                    const width = node.renderedWidth();
                    const height = node.renderedHeight();
                    const fileLabel = node.data('fileLabel') || '';

                    labelElements.title.textContent = node.data('label') || '';
                    labelElements.file.textContent = fileLabel;
                    labelElements.file.style.display = fileLabel && showFunctionFileSubtitles() ? 'block' : 'none';
                    labelElements.container.style.left = `${position.x - (width / 2)}px`;
                    labelElements.container.style.top = `${position.y - (height / 2)}px`;
                    labelElements.container.style.width = `${width}px`;
                    labelElements.container.style.height = `${height}px`;
                    labelElements.container.style.color = node.style('color');
                    labelElements.container.style.opacity = node.style('opacity');
                    labelElements.container.style.display = node.visible() ? 'flex' : 'none';
                    labelElements.title.style.fontSize = `${12 * zoom}px`;
                    labelElements.file.style.fontSize = `${9 * zoom}px`;
                    labelElements.file.style.marginTop = `${2 * zoom}px`;
                });

                nodeLabelElements.forEach((labelElements, nodeId) => {
                    if (!activeNodeIds.has(nodeId)) {
                        labelElements.container.remove();
                        nodeLabelElements.delete(nodeId);
                    }
                });
            }

            // The dropdown updates only this webview's state and immediately reruns klay.
            function setupKlayDirectionControl() {
                const container = document.getElementById('klay-direction-container');
                const select = document.getElementById('klay-direction-select');
                const usesKlay = state.config.defaultGraphLayoutAlgorithm === 'klay';

                container.style.display = usesKlay ? 'flex' : 'none';
                select.value = state.graphSettings.klayDirection;
                select.onchange = function() {
                    state.graphSettings = {
                        ...state.graphSettings,
                        klayDirection: select.value,
                    };

                    cy.layout(getLayoutOpts()).run();
                    vscode.setState(state);
                };
            }

            // Search functionality
            function setupSearch() {
                const searchInput = document.getElementById('search-input');
                const searchResults = document.getElementById('search-results');

                searchInput.addEventListener('input', debounce(function() {
                    const query = searchInput.value.toLowerCase().trim();
                    if (query.length < 2) {
                        searchResults.style.display = 'none';
                        resetHighlights();
                        return;
                    }

                    // Find matching nodes
                    const matchingNodes = cy.nodes().not(':parent').filter(node => {
                        const functionLabel = node.data('label') || '';
                        const fileLabel = node.data('fileLabel') || '';
                        return `${functionLabel} ${fileLabel}`.toLowerCase().includes(query);
                    });

                    // Display results
                    searchResults.innerHTML = '';
                    if (matchingNodes.length > 0) {
                        searchResults.style.display = 'block';
                        matchingNodes.forEach(node => {
                            const resultItem = document.createElement('div');
                            resultItem.className = 'search-result-item';
                            const functionLabel = node.data('label') || '';
                            const fileLabel = node.data('fileLabel') || '';
                            resultItem.textContent = [functionLabel, fileLabel].filter(Boolean).join(' — ');
                            resultItem.addEventListener('click', () => {
                                // Highlight the selected node
                                resetHighlights();
                                node.addClass('searchHighlight');

                                // Center and zoom to the node
                                cy.animate({
                                    fit: {
                                        eles: node,
                                        padding: 50
                                    },
                                    zoom: 1.5,
                                    duration: 200
                                });

                                searchResults.style.display = 'none';
                            });
                            searchResults.appendChild(resultItem);
                        });
                    } else {
                        searchResults.style.display = 'none';
                    }
                }, 300));

                // Close search results when clicking outside
                document.addEventListener('click', function(event) {
                    if (!searchResults.contains(event.target) && event.target !== searchInput) {
                        searchResults.style.display = 'none';
                    }
                });
            }

            document.addEventListener('DOMContentLoaded', function() {
                vscode.postMessage({
                    type: 'state',
                    data: 'loaded',
                })
            });

            const debouncedLayout = debounce(() => {
                cy.layout(getLayoutOpts()).run();
                vscode.setState(state)
            }, layoutDebounce[state.config.defaultGraphLayoutAlgorithm]);
            methods = {
                setParams: function(newParams) {
                    state = {...state, ...newParams};
                    state.graphSettings = {
                        ...state.graphSettings,
                        klayDirection: state.graphSettings?.klayDirection
                            ?? state.config.defaultKlayDirection
                            ?? 'DOWN',
                    };

                    vscode.postMessage({
                        type: 'state',
                        data: 'ready',
                    })
                    start()
                },
                addElems: function(newElems) {
					state.elems = state.elems.concat(newElems)

					cy.add(newElems)
					resetRootHighlights()
					resetLeafHighlights()
					resetHighlights()

					debouncedLayout();
                },
            }

            window.addEventListener('message', event => {
                const message = event.data;
                methods[message.type](message.data);
            });

            const start = function() {
                document.getElementById('node-labels').replaceChildren();
                nodeLabelElements.clear();

                cy = cytoscape({
                    container: document.getElementById('cy'),
                    style: getCyStyle(),
                    elements: state.elems,
                    wheelSensitivity: 0.5, // TODO: make configurable
                    minZoom: 0.075, // TODO: make configurable
                    maxZoom: 7.5, // TODO: make configurable
                });
                cy.layout(getLayoutOpts()).run();
                cy.on('render', syncNodeLabels);
                syncNodeLabels();

                // Setup search functionality
                setupKlayDirectionControl();
                setupSearch();

                cy.on('tap', function(e) {
                    if (e.target !== cy) {
                        return;
                    }

					resetHighlights()
                })

                cy.on('tap', 'node', function(e){
                    const node = e.target
                    const isCtrlDown = (e) => {
                        if (isMac && e.originalEvent.metaKey) {
                            return true
                        }
                        if (!isMac && e.originalEvent.ctrlKey) {
                            return true
                        }
                        return false
                    }
                    const isAltDown = (e) => {
                        if (e.originalEvent.altKey) {
                            return true
                        }
                        return false
                    }

                    const isShiftDown = (e) => {
                        if (e.originalEvent.shiftKey) {
                            return true
                        }
                        return false
                    }

                    // console.log(isMac)
                    // console.log(isCtrlDown(e))
                    // console.log(isAltDown(e))
                    // console.log(e.originalEvent.metaKey);
                    // console.log(e.originalEvent.shiftKey);
                    // console.log(e.originalEvent.altKey);
                    // console.log(e.originalEvent.ctrlKey);

                    if (isCtrlDown(e)) {
                        vscode.postMessage({
                            type: 'goToFunction',
                            data: node.id(),
                        })
                        return
                    }

					if (isAltDown(e)) {
                        if (isShiftDown(e)) {
                            vscode.postMessage({
                                type: 'expandBoth',
                                data: {
                                    id: node.id(),
                                    depth: -1,
                                },
                            })
                        } else {
                            vscode.postMessage({
                                type: 'expandBoth',
                                data: {
                                    id: node.id(),
                                    depth: 1,
                                },
                            })
                        }
						return
					}

                    if (!node.data('isHighlighted')) {
						resetHighlights()

                        // set highlight data for toggle
                        // highlight node, and parent. if only one child, highlight child
                        node.data('isHighlighted', true)
                        node.parent().data('isHighlighted', true)
                        if (node.children().size() == 1) {
                            node.children().data('isHighlighted', true)
                        }

                        // highlight neighborhood
                        let neighborhood = node
						neighborhood = neighborhood.add(node.children())
						neighborhood = neighborhood.add(neighborhood.neighborhood())
						neighborhood = neighborhood.add(neighborhood.parent())

                        neighborhood.nodes().addClass('highlightedNode');
                        neighborhood.edges().addClass('highlightedEdge');

                        // dim everything else
                        cy.nodes().not('.highlightedNode').addClass('dimmedNode');
                        cy.edges().not('.highlightedEdge').addClass('dimmedEdge');
                    } else {
                        node.data('isHighlighted', false)
                        node.parent().data('isHighlighted', false)
                        node.children().data('isHighlighted', false)
                        cy.nodes().removeClass(['highlightedNode', 'dimmedNode']);
                        cy.edges().removeClass(['highlightedEdge', 'dimmedEdge']);
                    }
                });
            }
        </script>
    </body>
</html>
