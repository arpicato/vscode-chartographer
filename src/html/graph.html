<!DOCTYPE html>
<html>
    <head>
        <title>Chartographer</title>
        <style>
            #cy {
                height: 500px;
                width: 100%;
                display: block;
                z-index: 10;
            }

            #instructions {
                position: absolute;
                top: 60px;
                left: 10px;
                background-color: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.5);
                padding: 10px;
                border-radius: 5px;
                font-size: 10px;
                line-height: 1;
                z-index: 20;
            }

            #hide-text {
                text-align: center;
                color: rgba(255, 255, 255, 0.5);
                font-size: 8px;
                text-decoration: underline;
                margin-top: 5px;
            }

            #question-mark {
                position: absolute;
                top: 10px;
                left: 10px;
                cursor: pointer;
                z-index: 20;
                font-size: 20px;
                color: rgba(255, 255, 255, 0.5);
                width: 40px;
                height: 40px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 20px;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            #question-mark:hover {
                text-decoration: underline;
            }
            #reset-zoom {
                position: absolute;
                top: 10px;
                left: 65px;
                cursor: pointer;
                z-index: 20;
                font-size: 12px;
                color: rgba(255, 255, 255, 0.5);
                width: 100px;
                height: 40px;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 10px;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            #search-container {
                position: absolute;
                top: 10px;
                right: 10px;
                z-index: 20;
                display: flex;
                align-items: center;
            }

            #search-input {
                padding: 8px;
                border-radius: 5px;
                border: none;
                background-color: rgba(0, 0, 0, 0.3);
                color: rgba(255, 255, 255, 0.9);
                width: 200px;
                font-size: 12px;
            }

            #search-results {
                position: absolute;
                top: 40px;
                right: 0;
                background-color: rgba(0, 0, 0, 0.7);
                border-radius: 5px;
                max-height: 200px;
                overflow-y: auto;
                width: 200px;
                display: none;
            }

            .search-result-item {
                padding: 8px;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.9);
                font-size: 12px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .search-result-item:hover {
                background-color: rgba(255, 255, 255, 0.1);
            }
        </style>
    </head>
    <body>
        <div id="question-mark" onclick="toggleInstructions()">&#63;</div>

        <div id="instructions" style="display: none;" onclick="toggleInstructions()">
            <p>Ctrl/Cmd + Left Click to go to function</p>
            <p>Left Click to highlight connections</p>
            <p>Left Click and drag to pan</p>
            <p>Scroll to zoom</p>
            <p>Alt/Opt + Left Click to expand graph by one level</p>
            <p>Alt/Opt + Shift + Left Click to expand graph recursively</p>
            <div id="hide-text">Click to hide</div>
        </div>

        <div id="reset-zoom" onclick="cy.fit()">Reset Zoom</div>

        <div id="search-container">
            <input type="text" id="search-input" placeholder="Search nodes..." />
            <div id="search-results"></div>
        </div>

        <div id="cy" style="height:100vh"></div>

        <script>
            function toggleInstructions() {
                const instructions = document.getElementById("instructions");
                if (instructions.style.display === "none" || instructions.style.display === "") {
                    instructions.style.display = "block";
                } else {
                    instructions.style.display = "none";
                }
            }
        </script>

        <script src="{{webviewScriptURI}}"></script>
    </body>
</html>
