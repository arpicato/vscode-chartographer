name: Publish to Marketplace

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Package VSIX
        run: |
          VER=${GITHUB_REF_NAME#v}
          npx vsce package --no-yarn -o chartographer-$VER.vsix
      - name: Upload VSIX to release
        run: |
          VER=${GITHUB_REF_NAME#v}
          gh release upload ${{ github.ref_name }} chartographer-$VER.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Marketplace
        run: npx vsce publish --no-yarn -p ${{ secrets.VSCE_PAT }}
        continue-on-error: true